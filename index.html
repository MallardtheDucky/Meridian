    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg: #03070b;
            --color-panel: #06111a;
            --color-panel-border: #0c2336;
            --color-cyan: #00e5ff;
            --color-cyan-dim: #007a8a;
            --color-amber: #ffb300;
            --color-red: #ff3d00;
            --color-text-dim: #548b99;
        }

        body {
            background-color: #000;
            color: var(--color-cyan);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-mono-tech {
            font-family: 'Share Tech Mono', monospace;
        }

        /* --- CRT Effects --- */
        .scanlines {
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,255,0.03), rgba(0,0,255,0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 9998;
        }

        .crt-vignette {
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 9999;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-panel); border-left: 1px solid var(--color-panel-border); }
        ::-webkit-scrollbar-thumb { background: var(--color-cyan-dim); border: 1px solid var(--color-bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-cyan); }

        /* --- Animations --- */
        @keyframes flicker {
            0% { opacity: 1; } 3% { opacity: 0.4; } 6% { opacity: 1; } 7% { opacity: 0.4; } 9% { opacity: 1; } 100% { opacity: 1; }
        }
        .animate-flicker { animation: flicker 6s infinite linear; }

        @keyframes pulse-cyan {
            0%, 100% { text-shadow: 0 0 4px rgba(0,229,255,0.4), 0 0 10px rgba(0,229,255,0.2); opacity: 1; }
            50% { text-shadow: 0 0 8px rgba(0,229,255,0.8), 0 0 20px rgba(0,229,255,0.4); opacity: 0.8; }
        }
        .text-glow { animation: pulse-cyan 3s ease-in-out infinite; }
        
        .static-glow { text-shadow: 0 0 5px rgba(0,229,255,0.5), 0 0 15px rgba(0,229,255,0.2); }
        .red-glow { text-shadow: 0 0 5px rgba(255,61,0,0.5), 0 0 15px rgba(255,61,0,0.2); }
        .amber-glow { text-shadow: 0 0 5px rgba(255,179,0,0.5), 0 0 15px rgba(255,179,0,0.2); }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0,229,255,0.5);
            box-shadow: 0 0 10px rgba(0,229,255,1);
            animation: scan 4s linear infinite;
            pointer-events: none;
            opacity: 0.3;
        }

        /* --- UI Elements --- */
        .tech-border {
            border: 1px solid var(--color-panel-border);
            position: relative;
        }
        .tech-border::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 6px; height: 6px; border-top: 2px solid var(--color-cyan); border-left: 2px solid var(--color-cyan);
        }
        .tech-border::after {
            content: ''; position: absolute; bottom: -1px; right: -1px; width: 6px; height: 6px; border-bottom: 2px solid var(--color-cyan); border-right: 2px solid var(--color-cyan);
        }

        .bg-grid {
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .window {
            position: absolute;
            background: var(--color-bg);
            border: 1px solid var(--color-cyan-dim);
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,229,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }
        .window-header {
            background: linear-gradient(90deg, var(--color-panel) 0%, var(--color-panel-border) 100%);
            border-bottom: 1px solid var(--color-cyan-dim);
            cursor: grab;
        }
        .window-header:active { cursor: grabbing; }
        .window.maximized {
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: calc(100% - 40px) !important;
            border-radius: 0;
        }
        .window.minimized { display: none; }

        .resize-handle {
            position: absolute;
            right: 0; bottom: 0;
            width: 18px; height: 18px;
            cursor: nwse-resize;
            z-index: 50;
            background: linear-gradient(135deg, transparent 0%, transparent 45%, var(--color-cyan-dim) 45%, var(--color-cyan-dim) 55%, transparent 55%, transparent 62%, var(--color-cyan-dim) 62%, var(--color-cyan-dim) 72%, transparent 72%, transparent 79%, var(--color-cyan-dim) 79%, var(--color-cyan-dim) 89%, transparent 89%);
                opacity: 0.7;
        }
        .resize-handle:hover { opacity: 1; background-color: transparent; filter: brightness(1.6); }
        .window.maximized .resize-handle { display: none; }
        @media (max-width: 767px) {
            .resize-handle { display: none; }
        }

        input:focus { outline: none; }

        /* Rank Insignia Specifics */
        .insignia-pip {
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8), 0 0 4px currentColor;
        }
        .insignia-red { color: var(--color-red); background-color: #8b0000; border: 1px solid var(--color-red); }
        .insignia-cyan { color: var(--color-cyan); background-color: #005f6b; border: 1px solid var(--color-cyan); }
        .insignia-amber { color: var(--color-amber); background-color: #8b6508; border: 1px solid var(--color-amber); }
        .insignia-blue { color: #2962ff; background-color: #0d205f; border: 1px solid #2962ff; }
        .insignia-dark { color: #548b99; background-color: #1a2c33; border: 1px solid #2c4d59; }

        /* --- Rank Plaque & Code Cylinder System --- */
        .plaque-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: radial-gradient(ellipse at center, #0a1620 0%, #020507 100%);
            border: 1px solid var(--color-panel-border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 14px rgba(0,229,255,0.08);
            border-radius: 2px;
        }
        .plaque-metal {
            background: linear-gradient(135deg, #ccd6df 0%, #a6b2bf 30%, #7d8b99 60%, #4a5663 100%);
            padding: 7px;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.8), 1px 1px 0 rgba(255,255,255,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            border: 1px solid #2c3844;
        }
        .plaque-row { display: flex; gap: 5px; }
        .p-tile {
            width: 20px; height: 28px;
            border: 1px solid rgba(0,0,0,0.65);
            position: relative;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.25), inset -1px -1px 2px rgba(0,0,0,0.4);
        }
        .p-tile::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, transparent 55%);
        }
        .p-tile-red    { background: linear-gradient(160deg, #ff3d00, #7a1c00); }
        .p-tile-cyan   { background: linear-gradient(160deg, #00e5ff, #005f6b); }
        .p-tile-amber  { background: linear-gradient(160deg, #ffb300, #7a5600); }
        .p-tile-blue   { background: linear-gradient(160deg, #4f7cff, #0d205f); }
        .p-tile-dark   { background: linear-gradient(160deg, #6b98a4, #1a2c33); }

        .code-cylinder {
            width: 10px; height: 42px;
            background: linear-gradient(90deg, #263238 0%, #b9c8ce 35%, #eaf7fa 50%, #b9c8ce 65%, #263238 100%);
            border-radius: 2px;
            position: relative;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.75), inset 0 0 2px rgba(255,255,255,0.1);
        }
        .code-cylinder::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px;
            background: linear-gradient(180deg, #0c2336, #010203);
            border-bottom: 1px solid #000;
            border-radius: 2px 2px 0 0;
        }
        .code-cylinder::after {
            content: ''; position: absolute; top: 10px; left: 2px; right: 2px; height: 3px;
            background: var(--color-cyan);
            box-shadow: 0 0 4px var(--color-cyan);
        }
        .code-cylinder.cyl-amber::after { background: var(--color-amber); box-shadow: 0 0 4px var(--color-amber); }
        .code-cylinder.cyl-red::after { background: var(--color-red); box-shadow: 0 0 4px var(--color-red); }

        /* --- Facility Map Room Buttons --- */
        .room-btn {
            position: relative;
            text-align: left;
            padding: 10px;
            background: linear-gradient(180deg, rgba(6,17,26,0.9), rgba(3,7,11,0.9));
            border: 1px solid var(--color-panel-border);
            transition: all 0.15s ease;
        }
        .room-btn:hover {
            border-color: var(--color-cyan);
            background: rgba(0,229,255,0.06);
            box-shadow: 0 0 12px rgba(0,229,255,0.15);
        }
        .room-btn.room-alert { border-color: rgba(255,61,0,0.5); }
        .room-btn.room-alert:hover { border-color: var(--color-red); box-shadow: 0 0 12px rgba(255,61,0,0.2); }

        /* --- Redacted Document Styling ---
           EVERY redaction in the OS — dossiers, message attachments, archive
           files, room schematics — is PERMANENTLY sealed. There is no code,
           clearance, or session key that unseals any of them; a click only
           ever flashes a brief denial. Text stays unselectable so it can't be
           grabbed via copy/select either (see revealRedact() in the script). */
        .redact {
            background: #000;
            color: #000;
            padding: 0 3px;
            border-radius: 1px;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px #1a1a1a;
            -webkit-user-select: none;
            user-select: none;
        }
        .redact:hover { box-shadow: inset 0 0 0 1px var(--color-red); }
        @keyframes denyFlash {
            0%, 100% { box-shadow: inset 0 0 0 1px #1a1a1a; }
            50% { box-shadow: inset 0 0 0 2px var(--color-red); background: rgba(255,61,0,0.25); }
        }
        .redact.denied { animation: denyFlash 0.5s ease; }
        .doc-stamp {
            position: absolute;
            top: 14px; right: -6px;
            border: 3px solid var(--color-red);
            color: var(--color-red);
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            letter-spacing: 0.15em;
            font-size: 11px;
            padding: 4px 10px;
            transform: rotate(8deg);
            opacity: 0.85;
            text-shadow: 0 0 6px rgba(255,61,0,0.6);
            box-shadow: 0 0 10px rgba(255,61,0,0.15);
            pointer-events: none;
            z-index: 20;
        }
        /* --- Sealed Personnel Dossier (scanned-paper document look) --- */
        .dossier-sheet {
            background: #cfcac2;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, transparent 1px, transparent 2px),
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.25), transparent 60%);
            color: #17140f;
            font-family: 'Share Tech Mono', monospace;
            padding: 18px;
            position: relative;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.12);
            border: 1px solid #8a8377;
        }
        .dossier-sheet .redact { box-shadow: inset 0 0 0 1px #000; }
        .dossier-photo {
            width: 92px; height: 110px;
            background: #0a0a0a;
            border: 2px solid #17140f;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .dossier-photo::after {
            content: 'IMAGE\\A UNAVAILABLE';
            white-space: pre;
            position: absolute; bottom: 4px; left: 0; right: 0;
            text-align: center;
            font-size: 7px; letter-spacing: 0.1em;
            color: #4a4a4a;
        }
        .dossier-field-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #55503f; }
        .dossier-field-value { font-size: 13px; font-weight: bold; color: #17140f; }

        /* --- Global Decryption Code Widget --- */
        .decrypt-panel {
            position: fixed;
            bottom: 46px; right: 12px;
            width: 240px;
            background: var(--color-panel);
            border: 1px solid var(--color-cyan-dim);
            box-shadow: 0 0 30px rgba(0,0,0,0.85);
            z-index: 10000;
            padding: 10px;
        }
        .doc-header-block {
            border: 1px solid var(--color-panel-border);
            background: rgba(255,61,0,0.04);
            padding: 8px 10px;
            margin-bottom: 14px;
            font-size: 10px;
            color: var(--color-text-dim);
        }

        /* --- COMMS_RELAY Message Styling --- */
        .classify-badge {
            display: inline-block;
            padding: 2px 7px;
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            border: 1px solid currentColor;
            white-space: nowrap;
        }
        .classify-unclassified { color: var(--color-text-dim); }
        .classify-restricted { color: var(--color-amber); }
        .classify-level4, .classify-level5 { color: var(--color-amber); }
        .classify-omega { color: var(--color-red); background: rgba(255,61,0,0.08); }

        .precedence-badge {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 7px;
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            border-radius: 1px;
        }
        .precedence-routine { color: var(--color-text-dim); background: rgba(84,139,153,0.08); }
        .precedence-priority { color: var(--color-amber); background: rgba(255,179,0,0.1); }
        .precedence-flash { color: var(--color-red); background: rgba(255,61,0,0.12); animation: flicker 4s infinite linear; }

        .msg-routing-block {
            border: 1px solid var(--color-panel-border);
            background: #010304;
            padding: 10px 12px;
            position: relative;
            overflow: hidden;
        }
        .msg-routing-block::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--color-cyan-dim), transparent 70%);
        }

        .attachment-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--color-panel-border);
            background: rgba(0,229,255,0.02);
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.15s ease;
        }
        .attachment-chip:hover { border-color: var(--color-cyan); background: rgba(0,229,255,0.07); }
        .attachment-chip.open { border-color: var(--color-cyan-dim); background: rgba(0,229,255,0.05); }

        .attachment-viewer {
            border: 1px solid var(--color-panel-border);
            border-top: none;
            background: #010304;
            padding: 10px;
        }

        /* --- Attachment Document Sheet (scanned-paper case-file look,
           matching the Sealed Personnel Dossier styling) --- */
        .doc-sheet {
            background: #cfcac2;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, transparent 1px, transparent 2px),
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.25), transparent 60%);
            color: #17140f;
            font-family: 'Share Tech Mono', monospace;
            padding: 16px;
            position: relative;
            box-shadow: 0 6px 24px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.12);
            border: 1px solid #8a8377;
        }
        .doc-sheet .redact { box-shadow: inset 0 0 0 1px #000; }
        .doc-sheet-header {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 12px;
            border-bottom: 2px solid #17140f;
        }
        .doc-sheet-field-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #55503f; }
        .doc-sheet-field-value { font-size: 12px; font-weight: bold; color: #17140f; word-break: break-word; }
        .doc-sheet-body { font-size: 12px; line-height: 1.6; }
        .doc-sheet-footer {
            margin-top: 14px;
            padding-top: 8px;
            border-top: 1px solid #8a8377;
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #55503f;
            text-align: center;
        }
        @media (max-width: 767px) {
            .doc-sheet-header { grid-template-columns: 1fr 1fr; }
        }

        /* --- Mobile / Small Viewport Adjustments --- */
        @media (max-width: 767px) {
            .window {
                border-width: 1px;
                left: 0 !important; top: 0 !important;
                width: 100% !important; height: calc(100% - 40px) !important;
            }
            .window-header { cursor: default; }
            .win-controls button { width: 30px !important; height: 30px !important; }
            .plaque-container { transform: scale(0.85); transform-origin: left center; }
            .p-tile { width: 16px; height: 22px; }
            .code-cylinder { width: 8px; height: 34px; }
            .decrypt-panel { width: calc(100% - 24px); right: 12px; bottom: 46px; }
            .dossier-sheet .flex.justify-between.items-start.gap-4 { flex-wrap: wrap; }
        }
        .stack-mobile { display: flex; flex-direction: column; }
        @media (min-width: 768px) {
            .stack-mobile { flex-direction: row; }
        }
        .mobile-cap { max-height: 38vh; }
        @media (min-width: 768px) {
            .mobile-cap { max-height: none; }
        }

    </style>
</head>
<body>

    <div class="fixed inset-0 scanlines"></div>
    <div class="fixed inset-0 crt-vignette"></div>

    <!-- Main Container -->
    <div id="app-root" class="w-full h-screen relative bg-grid"></div>

<script>
    
    const DB_TIER_LABELS = {

        },

        /* ---------------- TIER 2: DIVISION LEADERSHIP ---------------- */
        {
            id: 'r3', title: 'Director, Department of Rift Dynamics', tier: 2, department: 'Rift Dynamics', clearance: 'Level 5', address: 'Director',
            desc: 'Oversees all study of Rift formation, behavior, duration, and geographic distribution. Since the late 2020s this office has become the most-watched seat on the Council\'s briefing schedule, as its models are the primary source for the Directorate\'s central concern: the accelerating size and duration of new manifestations.',

            'FACTION NAME: The Meridian Directorate for Anomalous Research\nABBREVIATION/ALIAS: The Meridian Directorate // The Meridian\nFACTION TYPE: Independent Organization\nRIFTBORN VARIANT: No\nFOUNDED: 2009\n\nHEADQUARTERS: Streymoy, Faroe Islands. See 02_HEADQUARTERS for full record.\n\nPERSONNEL: Approximately 30,000, including researchers, engineers, medical specialists, archivists, expedition staff, security personnel, intelligence personnel, administrative employees, and personnel operating under Meridian front organizations. Only a portion of these personnel are aware they work for the Meridian at all; many believe they work for ordinary scientific institutions, private research companies, medical organizations, or government contractors.\n\nSee 04_LEADERSHIP, 05_PURPOSE, and 09_ORGANIZATIONAL_STRUCTURE for governance, mission, and division records.' },

        /* ---- 02: HEADQUARTERS ---- */
        'dir_hq': { name: '02_HEADQUARTERS', type: 'dir', children: ['hq_file'] },
        'hq_file': { name: 'STREYMOY_HQ.TXT', type: 'file', content:
            'STREYMOY HEADQUARTERS\nLocation: Streymoy, Faroe Islands\n\nThe organization\'s principal administrative and research facility. Located beneath a seemingly ordinary North Atlantic atmospheric research station, it contains the Directorate\'s central administration, primary laboratories, historical archives, advanced computing systems, and senior research staff.\n\nThe Directorate\'s geographic isolation provides security while still allowing relatively easy access to Europe and the North Atlantic, a balance the founders considered essential when selecting the site in 2009. From Streymoy, the Meridian gradually developed the network of legitimate scientific institutions, shell corporations, academic partnerships, and research foundations that let it operate without revealing its true existence.\n\nFor a full structural breakdown by level and room, consult the FACILITY_SCHEMATICS terminal.' },

        /* ---- 03: HOLDINGS ---- */
        'dir_holdings': { name: '03_HOLDINGS', type: 'dir', children: ['holdings_overview', 'holding_iceland', 'holding_newfoundland', 'holding_scotland'] },
        'holdings_overview': { name: '00_OVERVIEW.TXT', type: 'file', content:
            'ESTABLISHED HOLDINGS (beyond Streymoy HQ)\n\n1. Meridian North Atlantic Station — Iceland\n2. Meridian Newfoundland Facility — Newfoundland and Labrador\n3. Meridian Field Station — Scotland, United Kingdom\n\nEach holding operates under a legitimate cover identity and reports back to Streymoy through the Directorate\'s encrypted crystalline relay network. To the outside world these are separate organizations; to the Meridian, they are simply different pieces of the same network. See individual holding files for detail, or the FACILITY_SCHEMATICS terminal for room-level schematics.' },
        'holding_iceland': { name: '01_ICELAND_STATION.TXT', type: 'file', content:
            'MERIDIAN NORTH ATLANTIC STATION\nLocation: Iceland\n\nA remote Rift monitoring and atmospheric research station. It tracks anomalous activity across the North Atlantic and serves as a staging point for expeditions traveling between Europe, Iceland, Greenland, and the Arctic. The facility also conducts research into long-duration Rifts and unusual atmospheric phenomena — presently the Directorate\'s single highest research priority.' },
        'holding_newfoundland': { name: '02_NEWFOUNDLAND_FACILITY.TXT', type: 'file', content:
            'MERIDIAN NEWFOUNDLAND FACILITY\nLocation: Newfoundland and Labrador, Canada\n\nThe Directorate\'s principal North American research and expedition facility. Located in a remote area of Newfoundland, the facility provides the Meridian with access to the North American anomalous research network while maintaining significant distance from major population centers. It specializes in Rift detection, anomalous materials, expedition preparation, and monitoring activity throughout the North Atlantic. Its position also allows the Directorate to coordinate operations across North America.' },
        'holding_scotland': { name: '03_SCOTLAND_FIELD_STATION.TXT', type: 'file', content:
            'MERIDIAN FIELD STATION\nLocation: Scotland, United Kingdom\n\nA smaller European research and expedition facility used for anomalous research, equipment development, academic cooperation, and liaison with universities and independent researchers. It also provides logistical support for Meridian personnel traveling throughout Europe.' },

        /* ---- 04: LEADERSHIP ---- */
        'dir_leadership': { name: '04_LEADERSHIP', type: 'dir', children: ['leadership_file'] },
        'leadership_file': { name: 'LEADERSHIP.TXT', type: 'file', content:
            'The Meridian is governed by a small Directorate Council composed of senior researchers, administrators, and surviving former Commission personnel. The Council oversees major policy, research priorities, security, and any relations with outside organizations.\n\nA current Executive Director acts as the public and diplomatic representative of the organization when necessary, although very few people outside the Meridian know their true identity.\n\nThe Directorate Council operates under a strict principle:\n\n"The Meridian must survive, even if its members do not."\n\nFor full rank structure below Council level, consult the CHAIN_OF_COMMAND terminal.' },

        /* ---- 05: PURPOSE ---- */
        'dir_purpose': { name: '05_PURPOSE', type: 'dir', children: ['purpose_file'] },
        'purpose_file': { name: 'PURPOSE.TXT', type: 'file', content:
            'The Meridian Directorate exists to independently study Rifts and anomalous phenomena. Its primary objective is to understand the Rifts, their relationship with other realities, and their effects on Earth and the people on Earth.\n\nThe Directorate believes humanity has become too focused on containing anomalies without properly understanding them. It therefore prioritizes observation, research, controlled experimentation, and long-term study of the anomalies.\n\nIts greatest current concern is the increasing size and duration of Rifts observed throughout the late 2020s and early 2030s. The Meridian believes this may represent a fundamental and sudden change in the relationship between Earth and the realities within the Rifts.\n\nUNPUBLISHED SECONDARY PURPOSE:\nThe Meridian also exists to prevent anomalous knowledge from falling into the wrong hands. This objective is not publicly acknowledged, even within most of the organization itself.' },

        /* ---- 06: SIGNIFICANT ASSETS ---- */
        'dir_assets': { name: '06_SIGNIFICANT_ASSETS', type: 'dir', children: ['assets_file'] },
        'assets_file': { name: 'SIGNIFICANT_ASSETS.TXT', type: 'file', content:
            '1. ADVANCED RESEARCH DIVISION\nExceptional scientific personnel, laboratories, analytical systems, and research infrastructure dedicated to anomalous phenomena.\n\n2. ADVANCED ENGINEERING DIVISION\nExtensive experience developing specialized equipment, adapting to Rift-derived materials, constructing research systems, and combining anomalous discoveries with technology.\n\n3. EXPEDITIONARY LOGISTICS\nThe personnel, transportation, equipment, and logistical infrastructure necessary to conduct long-duration research expeditions through dangerous or remote Rift environments.' },

        /* ---- 07: ANOMALY REGISTRY ---- */
        'dir_registry': { name: '07_ANOMALY_REGISTRY', type: 'dir', children: ['registry_file'] },
        'registry_file': { name: 'REGISTRY_SUMMARY.TXT', type: 'file', content:
            'ANOMALY REGISTRY — HOLDING LIMITS (STARTING AUTHORIZATION)\n\nClass 1: Unlimited\nClass 2: 0 / 5\nClass 3: 0 / 3\nClass 4: 0 / 2\nClass 5: 0 / 1\nClass 6: 0 / 1\n\nThe Meridian does not necessarily believe every anomaly should be destroyed — see 12_CONTAINMENT_PHILOSOPHY. For the live, itemized registry of anomalies currently catalogued under each classification, consult the ANOMALY_REGISTRY terminal directly.' },

        /* ---- 08: HISTORY ---- */
        'dir_history': { name: '08_HISTORY', type: 'dir', children: ['history_origins', 'history_founding', 'history_expansion', 'history_present'] },
        'history_origins': { name: '01_ORIGINS.TXT', type: 'file', content:
            'The origins of the Meridian Directorate trace to the final decades of the Commission. Among the Commission\'s many divisions was a group of researchers dedicated to studying the deeper patterns behind Rift manifestations, rather than simply cataloguing or containing individual anomalies.\n\nThese researchers began to suspect that Rifts were not isolated events. Similarities between seemingly unrelated manifestations, anomalous materials, biological phenomena, and historical records suggested something larger connecting them. The research remained classified within the Commission.\n\nThen came the Brooklyn Exposure of June 22, 2007: a Rift in Prospect Park released roughly 173 stone-bodied entities that killed more than 10,000 people before military force finally ended the incident. Two centuries of classified agreements had left every institution capable of responding without the authority to act, and those with authority lacked the information. The Masquerade could not survive it.' },
        'history_founding': { name: '02_FOUNDING.TXT', type: 'file', content:
            'The Thirty-Six Days of leaks and seizures that followed Brooklyn ended with Disclosure on July 28, 2007. The Culling that followed in 2008-2009 devastated the Commission\'s institutional structure: facilities were seized, personnel disappeared, and enormous quantities of anomalous knowledge were scattered or destroyed. Most of the scientists who had spent their careers studying Rifts were suddenly without an institution.\n\nA small group of these researchers decided their work could not disappear with the Commission. They secretly recovered portions of Commission archives, research records, scientific equipment, and historical datasets before establishing their own independent organization in 2009: the Meridian Directorate.\n\nThe founders could not preserve everything — much Commission knowledge was seized by governments, absorbed into corporations, or lost entirely. But the Meridian retained enough to continue several of the Commission\'s unfinished research programs, deliberately remaining independent and hidden from both the rebuilding governments and the corporations beginning to recognize the Rifts\' commercial potential.' },
        'history_expansion': { name: '03_EXPANSION.TXT', type: 'file', content:
            'The Directorate established its headquarters in the Faroe Islands beneath a disguised research station, then gradually developed a network of legitimate scientific institutions, shell corporations, academic partnerships, and research foundations. Facilities followed in Iceland, Scotland, and eventually Newfoundland — to the outside world, separate organizations; to the Meridian, pieces of the same network.\n\nThis network became particularly valuable during the Rift Age (2017-2024). By the late 2010s the Meridian had become increasingly involved in long-duration Rift research, anomalous materials, Riftborn biology, and the development of specialized technologies. Its researchers began combining Rift materials with advanced computing systems, creating the Directorate\'s distinctive retro-housed computational technology.' },
        'history_present': { name: '04_PRESENT_DAY.TXT', type: 'file', content:
            'In the current year, the Meridian has become a large but almost entirely invisible organization operating beneath the surface of the post-Disclosure world. Governments know unexplained research facilities exist, and scientists occasionally encounter Meridian researchers, but almost nobody realizes these incidents are connected.\n\nThe Directorate\'s foremost concern is the trend first flagged across 2029-2032: Rifts are growing larger and lasting longer, for reasons nobody has been able to determine. See 05_PURPOSE and the Department of Rift Dynamics entry in 09_ORGANIZATIONAL_STRUCTURE.' },

        /* ---- 09: ORGANIZATIONAL STRUCTURE ---- */
        'dir_structure': { name: '09_ORGANIZATIONAL_STRUCTURE', type: 'dir', children: ['structure_file'] },
        'structure_file': { name: 'STRUCTURE.TXT', type: 'file', content:
            'The Meridian is organized into the following major divisions:\n\nDIRECTORATE COUNCIL\nGoverning body. Oversees major policy, funding, research priorities, and external relations.\n\nDEPARTMENT OF RIFT DYNAMICS\nStudies Rift formation, behavior, duration, and geographic distribution.\n\nDEPARTMENT OF ANOMALOUS BIOLOGY\nStudies Riftborn biology, anomalous organisms, ecosystems, diseases, and biological materials.\n\nDEPARTMENT OF MATERIALS SCIENCE\nStudies Rift materials and their potential applications in technology and industry.\n\nMERIDIAN SYSTEMS\nResponsible for computing infrastructure, communications, data analysis, and experimental computer systems.\n\nHISTORICAL ARCHIVES DIVISION\nMaintains recovered Commission records and investigates historical Rift events, including incidents predating Disclosure.\n\nEXPEDITIONARY DIVISION\nConducts field research, exploration, sample recovery, and investigation of newly discovered Rifts and Exclusion Zones.\n\nSECURITY AND INFORMATION DIVISION\nProtects Meridian personnel, facilities, research, and identities; manages compartmentalization and cover identities.\n\nEXTERNAL OPERATIONS DIVISION\nMaintains the Meridian\'s network of front organizations, shell companies, academic institutions, contractors, and contacts.\n\nFor personnel ranks within each division, consult the CHAIN_OF_COMMAND terminal.' },

        /* ---- 10: PUBLIC STATUS ---- */
        'dir_public_status': { name: '10_PUBLIC_STATUS', type: 'dir', children: ['public_status_file'] },
        'public_status_file': { name: 'PUBLIC_STATUS.TXT', type: 'file', content:
            'The Meridian Directorate is not publicly known to exist as an organization. The wider scientific community occasionally encounters Meridian-funded research facilities or personnel, but these activities are attributed to legitimate scientific institutions and private organizations.\n\nThe Meridian deliberately maintains several layers of separation between itself and the outside world. All the different shell organizations can ultimately trace their funding, personnel, or research back to the Meridian, but very few people know the full chain.\n\nSome governments are aware that an unidentified organization appears to be operating several anomalous research facilities worldwide. Some intelligence agencies refer to it as "Meridian," though there is no universally accepted confirmation that this is its actual name.\n\nThe Continuance almost certainly knows more. The Meridian considers this acceptable. See 13_THE_CONTINUANCE.' },

        /* ---- 11: TECHNOLOGY ---- */
        'dir_technology': { name: '11_TECHNOLOGY', type: 'dir', children: ['technology_file'] },
        'technology_file': { name: 'TECHNOLOGY.TXT', type: 'file', content:
            'The Meridian is particularly recognizable for its unconventional computing technology. Its laboratories combine advanced 2032 computing with experimental materials, some sourced from the Rifts: photonic processors, crystalline data systems, and highly specialized computing machines.\n\nMeridian technology has a distinctive retro-futuristic appearance. Computers are often retrofitted, analog-heavy, and resemble 1980s CRT terminals rather than conventional modern technology, though they are slightly more powerful than their appearance suggests. The analog housing is not an aesthetic affectation — it acts as a hardware buffer, shielding the crystalline subsystems from the data corruption that plagues conventional systems processing anomalous telemetry.\n\nThe systems are specifically designed to process anomalous data, allowing Meridian researchers to identify complex patterns in Rift activity that conventional systems may overlook.' },

        /* ---- 12: CONTAINMENT PHILOSOPHY ---- */
        'dir_philosophy': { name: '12_CONTAINMENT_PHILOSOPHY', type: 'dir', children: ['philosophy_file'] },
        'philosophy_file': { name: 'PHILOSOPHY.TXT', type: 'file', content:
            'The Meridian does not consider itself a containment organization, although it maintains containment facilities throughout its network.\n\nThe Meridian philosophy is simple: if an anomaly is dangerous and cannot be safely studied in the open, it must be isolated. Some anomalies are transferred to secure Meridian facilities. Others are monitored in their natural environments. Some are deliberately hidden from governments and corporations.\n\nThe Meridian does not necessarily believe every anomaly should be destroyed — in many cases, destroying an anomaly before understanding it could eliminate valuable information.' },

        /* ---- 13: THE CONTINUANCE ---- */
        'dir_continuance': { name: '13_THE_CONTINUANCE', type: 'dir', children: ['continuance_file'] },
        'continuance_file': { name: 'CONTINUANCE_RELATIONS.TXT', type: 'file', content:
            'The Meridian maintains an uneasy relationship with the Continuance. Both organizations possess fragments of anomalous knowledge accumulated before Disclosure, but their philosophies differ: the Meridian seeks to understand and expand upon the knowledge it holds, while the Continuance appears primarily concerned with preserving and controlling it.\n\nThe two organizations occasionally cooperate when circumstances require it, particularly when investigating historically significant anomalies. However, both remain suspicious of the other\'s motives and quietly compete for access to old Commission archives and anomalous discoveries.\n\nThe Meridian suspects the Continuance knows more about the origins of Rifts than it admits. Further assessment is restricted; see 99_RESTRICTED if cleared.' },

        /* ---- RESTRICTED ---- */
        'restricted': { name: '99_RESTRICTED', type: 'restricted_dir', children: ['commission_legacy', 'continuance_intel', 'council_directive', 'kashmir_assessment', 'brooklyn_afteraction', 'origin_fragment'] },
        'commission_legacy': { name: 'THE_CULLING_LOGS.DEC', type: 'file', content:
            'CLASSIFICATION: OMEGA\nSOURCE: Recovered analog fragments, origin unconfirmed\nCUSTODIAN: Archivist Prime\n\nRecords recovered from the ashes of the Commission following the Culling.\n\n[DATA CORRUPTED] ...governments demanded information. The removal of senior Commission personnel was systematic — first for knowing, then for lying about knowing. We took what we could before the archives disappeared entirely, including <span class="redact" onclick="revealRedact(this)">a partial personnel roster from the Streymoy founding cell</span> and <span class="redact" onclick="revealRedact(this)">correspondence naming three still-active government contacts</span>. We must never allow the Meridian to suffer the same fate. Secrecy is survival.\n\n[FRAGMENT ENDS]' },
        'continuance_intel': { name: 'CONTINUANCE_ASSESSMENT.INT', type: 'file', content:
            'CLASSIFICATION: OMEGA\nPREPARED BY: Office of the Executive Director\nDISTRIBUTION: Directorate Council only\n\nThe Continuance presents itself as a preservationist body, but we assess they know more about the origin of Rifts than they admit, and quite possibly more than the original Commission ever recovered. They possess fragments of pre-Disclosure knowledge we lack, reportedly including <span class="redact" onclick="revealRedact(this)">material predating even the 1806 incident</span>. We compete quietly for what remains of the old archives.\n\nDo not trust their agents, even during joint historical investigations. Their goal is control; ours is understanding. Current assessed leadership structure: <span class="redact" onclick="revealRedact(this)">unknown — no confirmed Continuance defector has survived contact long enough to debrief</span>.' },
        'council_directive': { name: 'DIRECTIVE_0.TXT', type: 'file', content:
            'CLASSIFICATION: OMEGA\nFROM: Directorate Council\nSTATUS: STANDING, IN FORCE\n\n"The Meridian must survive, even if its members do not."\n\nIn the event of a catastrophic exposure event, all front organizations will sever ties immediately. HQ will initiate a total data purge and physical lockdown at every holding via the Emergency Purge Control station. Personnel are expendable; the knowledge is not.\n\nSecondary fallback protocol, to be enacted only if Streymoy itself is compromised: <span class="redact" onclick="revealRedact(this)">activate the dormant relay cell and relocate the Deep Archive to the undisclosed secondary site referenced in Council correspondence</span>.' },
        'kashmir_assessment': { name: 'KASHMIR_WEAPONIZATION_WATCH.INT', type: 'file', content:
            'CLASSIFICATION: LEVEL 5\nFROM: Department of Materials Science\nDISTRIBUTION: Council, Security & Information Division\n\nThe 2022 Kashmir Rift Crisis confirmed what this department suspected since the Rift Age began: state militaries are actively weaponizing anomalous materials and organisms. VARUNA\'s failure and the resulting Exclusion Zone demonstrate the core danger — an anomalous weapon can outlast the conflict that deployed it, and the battle can end without the weapon ending.\n\nWe maintain a standing watch brief on all publicly acknowledged Exclusion Zones for signs of similar military origin, including undisclosed monitoring of <span class="redact" onclick="revealRedact(this)">the Făgăraș Closure and the Yakutsk Exclusion, both showing readings inconsistent with their public "natural disaster" classification</span>. This assessment is not shared with the Directorate Council\'s public-facing summaries.' },
        'brooklyn_afteraction': { name: 'BROOKLYN_AFTERACTION_REVIEW.DEC', type: 'file', content:
            'CLASSIFICATION: OMEGA\nSOURCE: Reconstructed from partial Commission field logs\nCUSTODIAN: Historical Archives Division\n\nInternal Commission review of the June 22, 2007 Prospect Park manifestation, recovered in fragments and reassembled long after Disclosure. Six hours elapsed between first containment request and authorized lethal-force deployment. Reconstructed chain of delay:\n\n1. Local authorities lacked clearance to acknowledge the manifestation as anomalous.\n2. The regional Commission liaison was <span class="redact" onclick="revealRedact(this)">unreachable for forty-one minutes due to a jurisdictional dispute with a separate, unacknowledged program</span>.\n3. Military authorization required sign-off from <span class="redact" onclick="revealRedact(this)">an official who did not believe the reports until viewing camera footage himself</span>.\n\nThe Directorate\'s founders cite this document as the single clearest argument against ever again allowing containment authority to depend on more than one chain of command. We do not intend to repeat it.' },
        'origin_fragment': { name: 'INQUIRY_ORIGIN_FRAGMENT.DEC', type: 'file', content:
            'CLASSIFICATION: OMEGA\nSOURCE: Newfoundland materials transfer, ledger fragment, authenticity under review\nCUSTODIAN: Archivist Prime\n\nPartial ledger, recordkeeping style consistent with pre-1908 Inquiry practice. Referenced location and circumstances of the 1806 incident remain <span class="redact" onclick="revealRedact(this)">a coastal settlement, name illegible, tentatively cross-referenced against three candidate sites in northern Europe</span>.\n\nMost significant line, translated: "...the manifestation does not close, only quiets. We have watched it quiet before." The implication — that whatever opened in 1806 was already being observed by someone prior to that date — has not been resolved. <span class="redact" onclick="revealRedact(this)">Cross-reference against Continuance-held material has been formally requested twice and declined twice.</span>\n\nPending Council review before wider circulation, even within Historical Archives.' }
    };

    /* ==========================================================================
       STATE MANAGEMENT & ENGINE
       ========================================================================== */
    const state = {
        booted: false,
        loggedIn: false,
        user: { name: 'Senior Researcher (ID: M-7742)', clearance: 'Level 5', facility: 'Streymoy HQ' },
        windows: [
            { id: 'dashboard', title: 'SYSTEM_TELEMETRY', icon: 'activity', x: 50, y: 50, w: 700, h: 450, open: false, maximized: false, zIndex: 1 },
            { id: 'archive', title: 'ARCHIVE_ACCESS', icon: 'database', x: 100, y: 100, w: 800, h: 500, open: false, maximized: false, zIndex: 2 },
            { id: 'map', title: 'FACILITY_SCHEMATICS', icon: 'map', x: 150, y: 80, w: 900, h: 600, open: false, maximized: false, zIndex: 3 },
            { id: 'messages', title: 'COMMS_RELAY', icon: 'mail', x: 200, y: 120, w: 600, h: 400, open: false, maximized: false, zIndex: 4 },
            { id: 'registry', title: 'ANOMALY_REGISTRY', icon: 'microscope', x: 250, y: 150, w: 850, h: 550, open: false, maximized: false, zIndex: 5 },
            { id: 'ranks', title: 'CHAIN_OF_COMMAND', icon: 'users', x: 300, y: 70, w: 950, h: 650, open: true, maximized: false, zIndex: 6 }
        ],
        highestZ: 10,
        dragState: null,
        resizeState: null,
        
        archivePath: ['root'],
        archiveViewFile: null,
        restrictedUnlocked: false,
        selectedRank: 'r1',
        ranksView: 'list',
        selectedMessage: 'M-101',
        openAttachments: {},
        activeFacility: 'streymoy',
        activeRoom: null,

        /* Local-decryption clearance code. Every .redact span across the OS
           (documents, room schematics, personnel dossiers) is PERMANENTLY
           sealed — entering a code never unseals anything; see
           submitDecryptCode() below. */
        showDecryptPanel: false,
        decryptError: '',

        /* Live telemetry: seeded log + stats that tick forward on an interval
           once the session is logged in, so SYSTEM_TELEMETRY reads as active
           rather than a static snapshot. */
        dashboardDetail: null,
        telemetryStats: { processor: 94.2, resonance: 88.6, relay: 76.4 },
        telemetryLog: [
            'SYNCHRONIZING WITH CRYSTALLINE SUBSYSTEM 0x00... OK',
            'SYNCHRONIZING WITH CRYSTALLINE SUBSYSTEM 0x01... OK',
            'SYNCHRONIZING WITH CRYSTALLINE SUBSYSTEM 0x02... OK',
            'PHOTONIC ARRAY CALIBRATION NOMINAL',
            'DETECTED BACKGROUND ANOMALOUS RADIATION IN SECTOR 4'
        ]
    };

    /* No decryption code unseals redacted material. This constant is kept only
       so a curious visitor entering "LATTICE-7" (an old, leaked reference)
       gets a distinct in-world response from a random guess — but even that
       code does not actually reveal anything; see submitDecryptCode() below.
       Distinct from the 99_RESTRICTED folder key (OBSIDIAN), which gates
       archive folder access rather than individual redactions. */
    const DECRYPT_CODE = 'LATTICE-7';

    function update() {
        // Preserve scroll position (both vertical AND horizontal) of every
        // tracked scrollable pane across the full re-render (innerHTML
        // replacement would otherwise reset them all back to the top-left,
        // which is why scrolling down/sideways used to "jump" back -
        // most visibly on SYSTEM_TELEMETRY, which re-renders every 3.5s).
        const scrollPos = {};
        document.querySelectorAll('[data-scroll-id]').forEach(el => {
            scrollPos[el.getAttribute('data-scroll-id')] = { top: el.scrollTop, left: el.scrollLeft };
        });
        render();
        document.querySelectorAll('[data-scroll-id]').forEach(el => {
            const key = el.getAttribute('data-scroll-id');
            if (scrollPos[key] !== undefined) {
                el.scrollTop = scrollPos[key].top;
                el.scrollLeft = scrollPos[key].left;
            }
        });
    }

    /* ==========================================================================
       LIVE TELEMETRY ENGINE
       Ticks the SYSTEM_TELEMETRY stats and diagnostic log forward on an
       interval so the dashboard reads as an active feed rather than a static
       snapshot, whether or not the window is currently open.
       ========================================================================== */
    const TELEMETRY_LOG_TEMPLATES = [
        () => `SYNCHRONIZING WITH CRYSTALLINE SUBSYSTEM 0x${Math.floor(Math.random()*16).toString(16).toUpperCase().padStart(2,'0')}... OK`,
        () => `PHOTONIC ARRAY CALIBRATION CYCLE COMPLETE`,
        () => `RELAY HANDSHAKE — ${['ICELAND STATION','NEWFOUNDLAND HUB','SCOTLAND BASE','STREYMOY HQ'][Math.floor(Math.random()*4)]}... OK`,
        () => `ANALOG BUFFER BANK ${Math.ceil(Math.random()*12)} WITHIN TOLERANCE`,
        () => `DETECTED BACKGROUND ANOMALOUS RADIATION IN SECTOR ${Math.ceil(Math.random()*6)}`,
        () => `CRYSTALLINE LATTICE RESONANCE DRIFT: ${(Math.random()*0.4).toFixed(2)}Hz — WITHIN TOLERANCE`,
        () => `THERMAL LOAD CHECK, RESEARCH CORE... NOMINAL`,
        () => `RIFT TELEMETRY FEED HEARTBEAT RECEIVED`,
        () => `WARNING: TRANSIENT LATENCY SPIKE ON NORTH ATLANTIC RELAY`,
        () => `ARCHIVE INDEX CHECKSUM VERIFIED`
    ];

    function jitter(value, range, min, max) {
        return Math.max(min, Math.min(max, value + (Math.random() - 0.5) * range));
    }

    function telemetryTick() {
        if (!state.loggedIn || !state.booted) return;
        const ts = state.telemetryStats;
        ts.processor = jitter(ts.processor, 2.4, 78, 99.5);
        ts.resonance = jitter(ts.resonance, 3, 70, 99);
        ts.relay = jitter(ts.relay, 5, 55, 98);

        const line = TELEMETRY_LOG_TEMPLATES[Math.floor(Math.random() * TELEMETRY_LOG_TEMPLATES.length)]();
        const stamp = new Date().toLocaleTimeString('en-US', { hour12: false });
        state.telemetryLog.unshift(`[${stamp}] ${line}`);
        if (state.telemetryLog.length > 24) state.telemetryLog.length = 24;

        update();
    }
    setInterval(telemetryTick, 3500);

    function bringToFront(id) {
        const win = state.windows.find(w => w.id === id);
        if (win && win.zIndex < state.highestZ) {
            state.highestZ++;
            win.zIndex = state.highestZ;
            update();
        }
    }

    function isMobileViewport() {
        return window.innerWidth < 768;
    }

    function toggleWindow(id) {
        const win = state.windows.find(w => w.id === id);
        if (win) {
            win.open = !win.open;
            // On phones/narrow viewports, free-floating draggable windows don't
            // make sense - every window opens full-screen instead, and the
            // taskbar becomes the app switcher.
            if (win.open && isMobileViewport()) win.maximized = true;
            if (win.open) bringToFront(id);
            else update();
        }
    }

    /* ==========================================================================
       DRAG AND DROP LOGIC
       ========================================================================== */
    document.addEventListener('mousemove', (e) => {
        if (state.resizeState) {
            const win = state.windows.find(w => w.id === state.resizeState.id);
            if (!win || win.maximized) return;
            const dx = e.clientX - state.resizeState.startX;
            const dy = e.clientY - state.resizeState.startY;
            const el = document.getElementById(`win-${win.id}`);
            if (el) {
                win.w = Math.max(340, state.resizeState.initW + dx);
                win.h = Math.max(240, state.resizeState.initH + dy);
                el.style.width = `${win.w}px`;
                el.style.height = `${win.h}px`;
            }
            return;
        }
        if (!state.dragState) return;
        const win = state.windows.find(w => w.id === state.dragState.id);
        if (!win || win.maximized) return;

        const dx = e.clientX - state.dragState.startX;
        const dy = e.clientY - state.dragState.startY;
        
        const el = document.getElementById(`win-${win.id}`);
        if (el) {
            win.x = Math.max(0, state.dragState.initWinX + dx);
            win.y = Math.max(0, state.dragState.initWinY + dy);
            el.style.left = `${win.x}px`;
            el.style.top = `${win.y}px`;
        }
    });

    document.addEventListener('mouseup', () => {
        if (state.dragState) state.dragState = null;
        if (state.resizeState) state.resizeState = null;
    });

    window.startDrag = function(e, id) {
        if (e.target.closest('.win-controls')) return;
        bringToFront(id);
        if (isMobileViewport()) return; // windows are locked full-screen on mobile
        const win = state.windows.find(w => w.id === id);
        if (win.maximized) return;
        state.dragState = { id, startX: e.clientX, startY: e.clientY, initWinX: win.x, initWinY: win.y };
    };

    window.startResize = function(e, id) {
        e.stopPropagation();
        e.preventDefault();
        if (isMobileViewport()) return; // windows are locked full-screen on mobile
        bringToFront(id);
        const win = state.windows.find(w => w.id === id);
        if (!win || win.maximized) return;
        state.resizeState = { id, startX: e.clientX, startY: e.clientY, initW: win.w, initH: win.h };
    };

    // Builds a plaque + flanking code-cylinder insignia block for a given rank.
    // `scale` is a maximum/preferred scale; it is automatically reduced for wide
    // plaques (many tiles/cylinders) so high-tier insignia never clips its frame.
    function renderPlaque(rank, scale) {
        const tileHtml = (colors) => colors.map(c => `<div class="p-tile p-tile-${c}"></div>`).join('');
        const cylCount = rank.cylinders || 0;
        const cylLeft = Math.ceil(cylCount / 2);
        const cylRight = Math.floor(cylCount / 2);
        const cylClass = rank.tier === 1 ? 'cyl-red' : (rank.tier <= 4 ? '' : 'cyl-amber');
        const cylHtml = (n) => Array(n).fill(`<div class="code-cylinder ${cylClass}"></div>`).join('');
        const tileCount = Math.max((rank.plaqueTop || []).length, (rank.plaqueBottom || []).length);
        // Approximate rendered width in px (tile 20 + gap 5, cylinder 10 + gap 5, plus padding/gaps) to keep wide plaques from overflowing their frame.
        const approxWidth = (tileCount * 25) + (cylCount * 15) + 60;
        const maxScale = scale || 1;
        const fitScale = Math.min(maxScale, 260 / approxWidth) ;
        const finalScale = Math.max(0.55, Math.min(maxScale, fitScale));
        const scaleStyle = `transform: scale(${finalScale.toFixed(2)}); transform-origin: left center;`;

        if (!rank.plaqueTop || rank.plaqueTop.length === 0) {
            return `<div class="text-[9px] text-[var(--color-text-dim)] italic border border-dashed border-[var(--color-panel-border)] px-3 py-2 text-center">NO INSIGNIA<br/>AUTHORIZED</div>`;
        }

        return `
            <div class="plaque-container" style="${scaleStyle}">
                <div class="flex gap-1">${cylHtml(cylLeft)}</div>
                <div class="plaque-metal">
                    <div class="plaque-row">${tileHtml(rank.plaqueTop)}</div>
                    ${rank.plaqueBottom && rank.plaqueBottom.length ? `<div class="plaque-row">${tileHtml(rank.plaqueBottom)}</div>` : ''}
                </div>
                <div class="flex gap-1">${cylHtml(cylRight)}</div>
            </div>`;
    }

    function findRoom(facilityId, roomName) {
        const fac = DB_FACILITIES[facilityId];
        if (!fac) return null;
        for (const lvl of fac.levels) {
            const room = lvl.rooms.find(r => r.name === roomName);
            if (room) return { room, level: lvl };
        }
        return null;
    }

    window.selectFacility = function(key) {
        state.activeFacility = key;
        state.activeRoom = null;
        update();
    };

    window.openRoom = function(name) {
        state.activeRoom = name;
        update();
    };

    window.closeRoom = function() {
        state.activeRoom = null;
        update();
    };

    function statusColorClass(status) {
        if (status === 'ACTIVE') return 'text-[var(--color-cyan)]';
        if (status === 'LOCKED') return 'text-[var(--color-amber)]';
        return 'text-[var(--color-red)]'; // RESTRICTED / CRITICAL

    function renderArchiveApp() {
        const currentDir = DB_FILESYSTEM[state.archivePath[state.archivePath.length - 1]];
        let fileContentHtml = '';
        
        if (state.archiveViewFile) {
            const file = DB_FILESYSTEM[state.archiveViewFile];
            const isRestrictedDoc = state.archivePath.includes('restricted');
            fileContentHtml = `
                <div class="flex-1 h-full p-4 overflow-y-auto bg-[var(--color-panel)] border-l border-[var(--color-panel-border)] flex flex-col font-mono-tech relative" data-scroll-id="archive-file">

                    <div class="flex justify-between items-center mb-4 border-b border-[var(--color-cyan-dim)] pb-2 shrink-0">
                        <span class="text-[var(--color-cyan)] font-bold text-lg break-all pr-2">${file.name}</span>
                        <button onclick="state.archiveViewFile = null; update()" class="flex items-center gap-1 text-xs border border-[var(--color-cyan-dim)] px-2 py-1 hover:bg-[var(--color-cyan)] hover:text-black shrink-0">
                            <i data-lucide="arrow-left" class="w-3 h-3"></i> <span class="hidden sm:inline">BACK TO FOLDER</span>
                        </button>
                    </div>
                    ${isRestrictedDoc ? `<div class="doc-header-block font-mono-tech">CLASSIFICATION: OMEGA &bull; DISTRIBUTION: DIRECTORATE COUNCIL AUTHORIZATION ONLY<br>Sections rendered as solid bars are permanently sealed at Council order. No clearance code unseals them.</div>` : ''}
                    <div class="text-[var(--color-text-dim)] whitespace-pre-wrap text-sm leading-relaxed">${file.content}</div>
                </div>`;
        }

        // Breadcrumb trail: each prior segment is clickable, giving a full "back to any previous page" mechanic.
        const breadcrumbHtml = state.archivePath.map((k, i) => {
            const isLast = i === state.archivePath.length - 1;
            const label = i === 0 ? 'ROOT' : (DB_FILESYSTEM[k]?.name || k);
            return `<span onclick="${isLast ? '' : `archiveJumpTo(${i})`}" class="${isLast ? 'text-white' : 'text-[var(--color-cyan-dim)] hover:text-[var(--color-cyan)] cursor-pointer underline decoration-dotted'}">${label}</span>`;
        }).join('<span class="text-[var(--color-panel-border)] mx-1">/</span>');

        let dirHtml = '';
        if (!currentDir) {
            dirHtml = '<div class="p-4 text-red-500">DIRECTORY ERROR</div>';
        } else if (currentDir.type === 'restricted_dir' && !state.restrictedUnlocked) {
            dirHtml = `
            <div class="flex-1 flex flex-col items-center justify-center p-8 text-center font-mono-tech">
                <i data-lucide="shield-alert" class="w-16 h-16 text-[var(--color-red)] mb-4 red-glow animate-flicker"></i>
                <div class="text-[var(--color-red)] font-bold text-xl tracking-widest mb-2">CLASSIFIED OMEGA</div>
                <div class="text-[var(--color-text-dim)] text-xs mb-6">RESTRICTED ARCHIVE. CLEARANCE REQUIRED.</div>
                <input type="password" id="restricted-input" class="bg-black border border-[var(--color-red)] text-[var(--color-red)] px-4 py-2 text-center focus:outline-none mb-4 uppercase" placeholder="PASSWORD">
                <button onclick="unlockRestricted()" class="border border-[var(--color-red)] text-[var(--color-red)] px-6 py-2 hover:bg-[var(--color-red)] hover:text-black transition-colors font-bold mb-4">DECRYPT</button>
                <div id="restricted-error" class="text-[var(--color-red)] text-xs mb-4 h-4"></div>
                <button onclick="archiveBack()" class="flex items-center gap-1 text-[10px] border border-[var(--color-cyan-dim)] text-[var(--color-cyan-dim)] px-3 py-1 hover:text-[var(--color-cyan)] hover:border-[var(--color-cyan)]">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> BACK
                </button>
            </div>`;
        } else {
            const items = currentDir.children.map(key => {
                const item = DB_FILESYSTEM[key];
                const icon = item.type === 'file' ? 'file-text' : (item.type === 'restricted_dir' ? 'shield' : 'folder');
                const color = item.type === 'restricted_dir' ? 'text-[var(--color-red)]' : 'text-[var(--color-cyan)]';
                return `
                <div onclick="archiveClick('${key}')" class="flex items-center gap-3 p-2 hover:bg-[var(--color-panel-border)] cursor-pointer group border-b border-[var(--color-panel)] font-mono-tech">
                    <i data-lucide="${icon}" class="w-5 h-5 ${color} group-hover:static-glow"></i>

            dirHtml = `
            <div class="w-full md:w-1/2 lg:w-1/3 mobile-cap md:h-full overflow-y-auto flex flex-col bg-black border-b md:border-b-0 md:border-r border-[var(--color-panel-border)]">

        return `

    window.archiveClick = function(key) {
        const item = DB_FILESYSTEM[key];
        if (item.type === 'file') {
            state.archiveViewFile = key;
        } else {
            state.archivePath.push(key);
            state.archiveViewFile = null;
        }
        update();
    };

    // Goes back exactly one level (parent directory) - the primary "previous page" mechanic.
    window.archiveBack = function() {
        if (state.archivePath.length > 1) {
            state.archivePath.pop();
            state.archiveViewFile = null;
            update();
        }
    };

    // Jumps directly back to any earlier breadcrumb segment.
    window.archiveJumpTo = function(index) {
        if (index >= 0 && index < state.archivePath.length - 1) {
            state.archivePath = state.archivePath.slice(0, index + 1);
            state.archiveViewFile = null;
            update();
        }
    };

    /* Every .redact span in the OS is permanently sealed. A click never
       reveals anything — it only ever flashes a brief denial. There is no
       code, session, or clearance level that unseals redacted content. */
    window.revealRedact = function(el) {
        el.classList.add('denied');
        setTimeout(() => el.classList.remove('denied'), 500);
    };

    window.toggleDecryptPanel = function() {
        state.showDecryptPanel = !state.showDecryptPanel;
        state.decryptError = '';
        update();
    };

    /* No code entered here ever unseals anything — redactions are permanent.
       This always reports denial; the LATTICE-7 reference gets a distinct
       message purely as in-world flavor (it's an old, leaked designation),
       but it does not unlock redacted content either. */
    window.submitDecryptCode = function() {
        const input = document.getElementById('decrypt-input');
        if (!input) return;
        const val = input.value.trim().toUpperCase();
        state.decryptError = (val === DECRYPT_CODE)
            ? 'CODE RECOGNIZED — REDACTIONS ARE PERMANENT'
            : 'ACCESS DENIED';
        input.value = '';
        update();
    };

        if (!state.showDecryptPanel) return '';
        return `

            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] text-[var(--color-cyan)] uppercase tracking-widest">Local Decryption</span>
                <button onclick="toggleDecryptPanel()" class="text-[var(--color-text-dim)] hover:text-[var(--color-red)]"><i data-lucide="x" class="w-3 h-3"></i></button>

            <div class="text-[9px] text-[var(--color-text-dim)] mb-2 leading-relaxed">Redacted material is permanently sealed at Council order. No clearance code unseals it from this terminal.</div>
            <input id="decrypt-input" type="text" placeholder="CODE" autocomplete="off" onkeypress="if(event.key === 'Enter') submitDecryptCode()" class="w-full bg-black border border-[var(--color-cyan-dim)] text-[var(--color-cyan)] px-2 py-1.5 text-xs font-mono-tech mb-2 uppercase tracking-widest" />
            <button onclick="submitDecryptCode()" class="w-full border border-[var(--color-cyan)] text-[var(--color-cyan)] py-1.5 text-[10px] uppercase tracking-widest hover:bg-[var(--color-cyan)] hover:text-black transition-colors">Decrypt</button>
            <div class="text-[9px] text-[var(--color-red)] mt-2 h-3 uppercase">${state.decryptError}</div>
        </div>`;
    }

    window.unlockRestricted = function() {
        const input = document.getElementById('restricted-input').value.trim().toUpperCase();
        if (input === 'OBSIDIAN') {
            state.restrictedUnlocked = true;
            update();

            document.getElementById('restricted-error').innerText = 'ACCESS DENIED';
            setTimeout(() => { const el = document.getElementById('restricted-error'); if (el) el.innerText = ''; }, 2000);

    // Renders the click-through detail overlay shown over the telemetry

    // Small reusable radial-style gauge card for the telemetry dashboard.
    function renderGaugeCard(label, value, sublabel, colorVar, key) {
        const pct = Math.max(0, Math.min(100, value));
        return `

    function renderDashboardApp() {
        const ts = state.telemetryStats;

        /* Anomaly containment capacity, built directly from DB_ANOMALIES so
           the chart always reflects the same figures the ANOMALY_REGISTRY
           terminal reports. 'Unlimited' classes render as a full, uncapped bar. */
        const anomalyBars = DB_ANOMALIES.map(a => {
            const m = a.limit.match(/(\d+)\s*\/\s*(\d+)/);
            const held = m ? parseInt(m[1], 10) : 0;
            const cap = m ? parseInt(m[2], 10) : 1;
            const pct = a.limit === 'Unlimited' ? 100 : Math.round((held / cap) * 100);
            return `
                <div onclick="showDashboardDetail('anomaly', '${a.class}')" class="flex items-center gap-2 text-[10px] cursor-pointer group">
                    <div class="w-14 shrink-0 text-[var(--color-text-dim)] uppercase group-hover:text-[var(--color-cyan)] transition-colors">${a.class}</div>
                    <div class="flex-1 h-2 bg-black border border-[var(--color-panel-border)] overflow-hidden group-hover:border-[var(--color-cyan)] transition-colors">
                        <div class="h-full ${pct > 0 ? 'bg-[var(--color-amber)]' : 'bg-[var(--color-cyan-dim)] opacity-30'}" style="width: ${pct}%;"></div>
                    </div>
                    <div class="w-16 shrink-0 text-right text-white font-bold">${a.limit}</div>
                </div>`;
        }).join('');

        const facilityKeys = Object.keys(DB_FACILITIES);
        const facilityCards = facilityKeys.map((key, i) => {
            const fac = DB_FACILITIES[key];
            const alertRoom = fac.levels.some(l => l.rooms.some(r => r.alert));
            const latency = 4 + Math.round(Math.random() * 22) + (key === 'streymoy' ? 0 : 8);
            return `
                <div onclick="showDashboardDetail('facility', '${key}')" class="border ${alertRoom ? 'border-[var(--color-amber)] border-opacity-50' : 'border-[var(--color-panel-border)]'} p-2 bg-black/50 cursor-pointer hover:border-[var(--color-cyan)] transition-colors">
                    <div class="text-xs font-bold text-white mb-1 truncate">${fac.shortName}</div>
                    <div class="text-[10px] ${alertRoom ? 'text-[var(--color-amber)]' : 'text-[var(--color-cyan)]'} flex items-center gap-1 mb-1.5">
                        <span class="w-1.5 h-1.5 rounded-full ${alertRoom ? 'bg-[var(--color-amber)] animate-ping' : 'bg-[var(--color-cyan)]'}"></span>
                        ${alertRoom ? 'EXPEDITION ACTIVE' : 'ONLINE'}
                    </div>
                    <div class="grid grid-cols-2 gap-x-2 text-[9px] text-[var(--color-text-dim)]">
                        <span>RELAY LATENCY</span><span class="text-right text-white">${latency}ms</span>
                        <span>PERSONNEL</span><span class="text-right text-white">${fac.personnel}</span>
                    </div>
                </div>`;
        }).join('');

        const logHtml = state.telemetryLog.map((line, i) => {
            const isWarn = /WARN|ANOMALOUS|ELEVATED/i.test(line);
            return `<div class="${isWarn ? 'text-[var(--color-amber)]' : ''}">${line}</div>`;
        }).join('');

        return `
        <div class="relative w-full h-full">
        <div class="w-full h-full p-4 grid grid-cols-2 md:grid-cols-3 gap-4 font-mono-tech bg-[var(--color-bg)] overflow-y-auto custom-scrollbar" data-scroll-id="dashboard-main">
            ${renderGaugeCard('Systems / Processor', ts.processor, 'Photonic Array Optimal', '--color-cyan', 'processor')}
            ${renderGaugeCard('Crystalline Resonance', ts.resonance, 'Lattice Stability Nominal', '--color-amber', 'resonance')}
            ${renderGaugeCard('Relay Network Throughput', ts.relay, 'Inter-Holding Uplink', '--color-cyan', 'relay')}

            <div class="col-span-2 md:col-span-2 tech-border bg-[var(--color-panel)] p-4 relative overflow-hidden">
                <div class="absolute inset-0 bg-grid opacity-20"></div>
                <div class="relative z-10 flex justify-between h-full flex-col">
                    <div class="flex justify-between items-start border-b border-[var(--color-panel-border)] pb-1 mb-2">

                    </div>
                    <div class="flex-1 flex items-end gap-1 h-24 pt-2">
                        ${Array.from({length: 30}).map((_, i) => {
                            const h = 20 + (i * 2) + (Math.random() * 20);
                            const color = h > 70 ? 'bg-[var(--color-amber)]' : 'bg-[var(--color-cyan-dim)]';
                            return `<div class="flex-1 ${color}" style="height: ${Math.min(100, h)}%"></div>`;
                        }).join('')}
                    </div>
                </div>
            </div>

            <div class="col-span-2 md:col-span-1 tech-border bg-[var(--color-panel)] p-4">
                <div class="text-[10px] text-[var(--color-cyan-dim)] uppercase border-b border-[var(--color-panel-border)] pb-1 mb-3">Anomaly Containment Capacity</div>

                <div class="text-[var(--color-cyan-dim)] opacity-50 sticky top-0 bg-black">SYSTEM_DIAGNOSTIC_LOG // LIVE // newest first</div>
                ${logHtml}
            </div>
        </div>
        ${renderDashboardDetailOverlay()}

    function classifyBadgeClass(c) {
        if (!c) return 'classify-unclassified';
        const u = c.toUpperCase();
        if (u.includes('OMEGA')) return 'classify-omega';
        if (u.includes('LEVEL 5')) return 'classify-level5';
        if (u.includes('LEVEL 4')) return 'classify-level4';
        if (u.includes('RESTRICTED')) return 'classify-restricted';
        return 'classify-unclassified';
    }

    function precedenceBadgeClass(p) {
        if (!p) return 'precedence-routine';
        const u = p.toUpperCase();
        if (u === 'FLASH') return 'precedence-flash';
        if (u === 'PRIORITY') return 'precedence-priority';
        return 'precedence-routine';
    }

                                            </div>

            <div class="flex flex-col bg-[var(--color-panel)] font-mono-tech p-4">
                <div class="msg-routing-block sticky top-0 z-10 mb-4">
                    <div class="flex flex-wrap items-center gap-2 mb-2.5">
                        <span class="classify-badge ${classifyBadgeClass(selected.classification)}">${selected.classification}</span>
                        <span class="precedence-badge ${precedenceBadgeClass(selected.precedence)}">${selected.precedence === 'FLASH' ? '⚡ ' : ''}${selected.precedence}</span>
                    </div>
                    <div class="grid grid-cols-[46px_1fr] text-xs gap-y-1">
                        <span class="text-[var(--color-cyan-dim)]">FM:</span> <span class="text-white">${selected.from}</span>
                        <span class="text-[var(--color-cyan-dim)]">TO:</span> <span class="text-[var(--color-text-dim)]">${selected.to}</span>
                        <span class="text-[var(--color-cyan-dim)]">DTG:</span> <span class="text-[var(--color-text-dim)]">${selected.date}</span>
                    </div>
                    <div class="mt-3 pt-2 border-t border-[var(--color-panel-border)] text-sm font-bold text-[var(--color-cyan)]">${selected.subject}</div>
                </div>
                <div class="text-sm text-[var(--color-text-dim)] whitespace-pre-wrap leading-relaxed">
                    ${selected.body}
                </div>
                ${attachmentsHtml}
            </div>`;
        }

        return `
        <div class="w-full h-full flex flex-col md:flex-row">
            <div class="w-full md:w-1/3 md:min-w-[220px] mobile-cap md:h-full bg-black border-b md:border-b-0 md:border-r border-[var(--color-panel-border)] overflow-y-auto custom-scrollbar" data-scroll-id="messages-list">
                ${listHtml}
            </div>
            <div class="flex-1 min-h-0 md:h-full overflow-y-auto custom-scrollbar" data-scroll-id="messages-detail">
                ${detailHtml}
            </div>
        </div>`;
    }

    /* Initialize */
    render();
</script>
</body>
</html>
